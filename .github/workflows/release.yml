name: Build & Deploy Release

# Tag-driven release pipeline modelled on sqail's pipeline (same VPS, same
# k3s cluster, same secrets). On every v* tag we:
#   1. Build the insyncbee-db-service binary for Linux, macOS and Windows
#   2. Build the desktop app (tray + UI) as .deb/.rpm/.AppImage for Linux
#   3. Publish the archives + checksums to the matching GitHub Release
#   4. Build & push the portal image to ACR
#   5. Upload the binaries to the VPS hostPath that the portal pod serves
#   6. Roll the portal deployment so it picks up the new image and binaries
#
# Required repository secrets:
#   ACR_USERNAME, ACR_PASSWORD                                     — Azure Container Registry credentials
#   K3S_SSH_HOST, K3S_SSH_USER, K3S_SSH_PRIVATE_KEY                — SSH access to the k3s VPS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_portal:
        description: "Also rebuild and deploy the portal"
        type: boolean
        default: true

env:
  REGISTRY: beecodersregistry.azurecr.io
  IMAGE_NAME: insyncbee-portal
  ARCHIVE_BASENAME: insyncbee-db-service
  VPS_RELEASES_DIR: /srv/insyncbee/releases

jobs:
  # ── Prepare: extract version ────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' insyncbee.portal/package.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          fi
          echo "app_version=${APP_VERSION}"  >> "$GITHUB_OUTPUT"
          echo "tag=v${APP_VERSION}"         >> "$GITHUB_OUTPUT"
          echo "Version: ${APP_VERSION}"

  # ── Build db-service for each platform ──────────────────────────────────
  build-db-service:
    needs: prepare
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          # Intel Mac (macos-13) runners are scarce on free GitHub Actions and
          # Intel Mac usage is shrinking — Apple Silicon users are covered by
          # macos-aarch64. Re-add a `macos-x86_64` entry here if needed.
          - label: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build daemon
        shell: bash
        run: cargo build --release --locked -p insyncbee-daemon --target ${{ matrix.target }}

      - name: Stage binary
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          STAGE="stage/${ARCHIVE_BASENAME}-${VERSION}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          if [[ "${{ matrix.runner }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/insyncbee.exe" "$STAGE/"
          else
            cp "target/${{ matrix.target }}/release/insyncbee" "$STAGE/"
          fi
          cat > "$STAGE/README.txt" <<EOF
          InSyncBee db-service ${VERSION} (${{ matrix.label }})

          The 'insyncbee' binary is the headless background sync service.
          Run 'insyncbee --help' for usage.
          EOF
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          ARCHIVE="dist/releases/${ARCHIVE_BASENAME}-${VERSION}-${{ matrix.label }}.tar.gz"
          tar -C "${{ steps.stage.outputs.stage }}" -czf "$ARCHIVE" .
          shasum -a 256 "$ARCHIVE" | sed "s# .*/# #" > "$ARCHIVE.sha256"
          ls -lh dist/releases/

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/releases | Out-Null
          $archive = "dist/releases/$env:ARCHIVE_BASENAME-$env:VERSION-${{ matrix.label }}.zip"
          Compress-Archive -Path "${{ steps.stage.outputs.stage }}/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          $base = Split-Path -Leaf $archive
          "$hash  $base" | Out-File -Encoding ascii "$archive.sha256"
          Get-ChildItem dist/releases

      - uses: actions/upload-artifact@v4
        with:
          name: db-service-${{ matrix.label }}
          path: dist/releases/insyncbee-db-service-*
          if-no-files-found: error
          retention-days: 30

  # ── Build the desktop app (tray + UI) ───────────────────────────────────
  # Linux only for now: macOS and Windows bundles are worse than useless
  # unsigned — Gatekeeper and SmartScreen block them — and signing needs
  # certificates that aren't in this repo's secrets. Add runners here once
  # they are.
  build-desktop:
    needs: prepare
    name: Build desktop (linux-x86_64)
    runs-on: ubuntu-22.04
    env:
      DESKTOP_BASENAME: insyncbee-desktop
      LABEL: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # libayatana-appindicator3 is what puts the tray icon on screen; without
      # it the app builds but starts with no tray at all.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # tauri.conf.json's beforeBuildCommand runs `pnpm build` in ui/, which
      # needs the dependencies present first.
      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        env:
          # appimagetool needs FUSE, which GitHub runners don't provide;
          # extract-and-run is the supported way around it. NO_STRIP avoids
          # linuxdeploy stripping the AppImage payload and failing on it.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: cargo tauri build --bundles deb,rpm,appimage

      # The workspace shares one target dir at the repo root, so bundles land
      # in target/release/bundle — NOT src-tauri/target.
      - name: Stage bundles
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          shopt -s nullglob
          for src in target/release/bundle/deb/*.deb \
                     target/release/bundle/rpm/*.rpm \
                     target/release/bundle/appimage/*.AppImage; do
            ext="${src##*.}"
            dest="dist/releases/${DESKTOP_BASENAME}-${VERSION}-${LABEL}.${ext}"
            cp "$src" "$dest"
            shasum -a 256 "$dest" | sed "s# .*/# #" > "$dest.sha256"
          done
          if [ -z "$(ls -A dist/releases)" ]; then
            echo "No bundles were produced — check the tauri build output above." >&2
            exit 1
          fi
          ls -lh dist/releases/

      # v0.2.2 shipped an AppImage that SIGABRTed before drawing a window
      # ("Could not create GBM EGL display") on any machine where WebKitGTK's
      # DMABUF renderer can't reach a GPU. A runner under Xvfb has no GPU
      # either, so it reproduces exactly that class of failure: if the app is
      # still alive after 20s it started; any exit inside the window is a
      # crash worth blocking the release for.
      - name: Smoke-test the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -uo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          APP="dist/releases/${DESKTOP_BASENAME}-${{ needs.prepare.outputs.app_version }}-${LABEL}.AppImage"
          set +e
          timeout 20 xvfb-run -a "$APP" --tray 2>&1 | tee /tmp/appimage-smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited with $code within 20s instead of staying up — see the log above."
            exit 1
          fi
          echo "AppImage was still running after 20s."

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: dist/releases/insyncbee-desktop-*
          if-no-files-found: error
          retention-days: 30

  # ── Create / update GitHub Release ──────────────────────────────────────
  github-release:
    needs: [prepare, build-db-service, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.app_version }}"
          FILES=()
          for f in artifacts/insyncbee-*; do
            [ -f "$f" ] && FILES+=("$f")
          done
          NOTES="InSyncBee ${VERSION}

          * \`insyncbee-db-service-*\` — headless background sync service (CLI + daemon), all platforms.
          * \`insyncbee-desktop-*\` — desktop app with tray icon and UI (Linux x86_64)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TAG" \
              --notes "$NOTES"
          fi

  # ── Upload binaries to VPS so the portal pod can serve them ─────────────
  deploy-binaries:
    needs: [prepare, build-db-service, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      # NOTE: ${{ env.VPS_RELEASES_DIR }} (/srv/insyncbee/releases) must already
      # exist on the VPS and be owned by the SSH user. Run ONCE on the VPS:
      #   sudo mkdir -p /srv/insyncbee/releases
      #   sudo chown -R $USER:$USER /srv/insyncbee
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K3S_SSH_HOST }}
          username: ${{ secrets.K3S_SSH_USER }}
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          source: "artifacts/*"
          target: ${{ env.VPS_RELEASES_DIR }}
          strip_components: 1

      - name: Generate manifest on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_SSH_HOST }}
          username: ${{ secrets.K3S_SSH_USER }}
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.VPS_RELEASES_DIR }}
            FILES=$(ls -1 insyncbee-db-service-* insyncbee-desktop-* 2>/dev/null | jq -R -s 'split("\n") | map(select(length > 0))')
            cat > manifest.json <<EOF
            {
              "version": "${{ needs.prepare.outputs.app_version }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "files": $FILES
            }
            EOF
            echo "Manifest:"
            cat manifest.json

  # ── Rebuild & deploy portal so download links + releases.json refresh ──
  deploy-portal:
    needs: [prepare, deploy-binaries]
    if: ${{ github.event_name == 'push' || inputs.deploy_portal }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin version + releasedAt in releases.ts
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          RELEASED_AT=$(date -u +%Y-%m-%d)
          F=insyncbee.portal/src/data/releases.ts
          sed -i "s/version: \"[^\"]*\"/version: \"${VERSION}\"/"          "$F"
          sed -i "s/releasedAt: \"[^\"]*\"/releasedAt: \"${RELEASED_AT}\"/" "$F"
          echo "After sed:"
          grep -E "version:|releasedAt:" "$F"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push portal image
        uses: docker/build-push-action@v5
        with:
          context: ./insyncbee.portal
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.app_version }}

      - name: Deploy to K3S
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_SSH_HOST }}
          username: ${{ secrets.K3S_SSH_USER }}
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          script: |
            if command -v kubectl >/dev/null 2>&1; then
              KUBECTL="kubectl"
            else
              KUBECTL="sudo k3s kubectl"
            fi
            $KUBECTL -n insyncbee rollout restart deployment insyncbee-portal
            $KUBECTL -n insyncbee rollout status deployment insyncbee-portal --timeout=120s
